networks:
  listen-wiseer-network:
    driver: bridge

volumes:
  postgres-data:
  navidrome-data:

services:

  # ── Postgres (LangGraph checkpointer — always-on) ─────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: listen-wiseer-db
    environment:
      - POSTGRES_DB=listen_wiseer
      - POSTGRES_USER=wiseer
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - listen-wiseer-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiseer -d listen_wiseer"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── DB init (one-shot: DuckDB schema + bootstrap from archived CSVs if present) ─
  db-init:
    build:
      context: ../..
      dockerfile: infrastructure/containers/app/Dockerfile
    container_name: listen-wiseer-db-init
    command: python -m etl.bootstrap
    environment:
      - PYTHONPATH=/app/src
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ../../data:/app/data
      - ../../infrastructure/db:/app/infrastructure/db
      - ../../models:/app/models
    networks:
      - listen-wiseer-network
    restart: no

  # ── MCP server (agent music tools over streamable HTTP: http://localhost:8765/mcp) ──
  mcp:
    build:
      context: ../..
      dockerfile: infrastructure/containers/mcp/Dockerfile
    container_name: listen-wiseer-mcp
    ports:
      - "8765:8765"
    environment:
      - PYTHONPATH=/app/src
      - MCP_TRANSPORT=streamable-http
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=8765
      - USER_ID=${USER_ID:-default}
      - LAST_FM_API_KEY=${LAST_FM_API_KEY}
      - LISTENBRAINZ_TOKEN=${LISTENBRAINZ_TOKEN}
      - LISTENBRAINZ_USER=${LISTENBRAINZ_USER}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - JAMENDO_CLIENT_ID=${JAMENDO_CLIENT_ID}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ../../data:/app/data
      - ../../infrastructure/db:/app/infrastructure/db
      - ../../models:/app/models
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks:
      - listen-wiseer-network
    restart: unless-stopped

  # ── Chainlit app (chat UI + LangGraph agent) ─────────────────────────────────
  app:
    build:
      context: ../..
      dockerfile: infrastructure/containers/app/Dockerfile
    container_name: listen-wiseer-app
    ports:
      - "8501:8501"
    environment:
      - PYTHONPATH=/app/src
      - USER_ID=${USER_ID:-default}
      - LAST_FM_API_KEY=${LAST_FM_API_KEY}
      - LISTENBRAINZ_TOKEN=${LISTENBRAINZ_TOKEN}
      - LISTENBRAINZ_USER=${LISTENBRAINZ_USER}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - JAMENDO_CLIENT_ID=${JAMENDO_CLIENT_ID}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - POSTGRES_URL=postgresql+psycopg://wiseer:${POSTGRES_PASSWORD:-changeme}@postgres:5432/listen_wiseer
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LISTENING_HISTORY_PATH=/app/data/listening_history
      - MAX_AGENT_ITERATIONS=${MAX_AGENT_ITERATIONS:-10}
      - AGENT_TIMEOUT_SECONDS=${AGENT_TIMEOUT_SECONDS:-60}
    volumes:
      - ../../data:/app/data
      - ../../infrastructure/db:/app/infrastructure/db
      - ../../models:/app/models
      - ../../logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - listen-wiseer-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Optional: Navidrome music server (--profile library) ─────────────────────
  # Serves data/library/ (legal downloads) over the Subsonic API → phone apps
  # (Symfonium, Substreamer) cache offline. Web UI: http://localhost:4533
  navidrome:
    image: deluan/navidrome:0.53.3
    container_name: listen-wiseer-navidrome
    ports:
      - "4533:4533"
    environment:
      - ND_SCANSCHEDULE=1h
      - ND_LOGLEVEL=info
    volumes:
      - ../../data/library:/music:ro
      - navidrome-data:/data
    networks:
      - listen-wiseer-network
    restart: unless-stopped
    profiles:
      - library

  # ── Optional: Jaeger tracing (--profile observability) ───────────────────────
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: listen-wiseer-jaeger
    ports:
      - "16686:16686"
      - "14268:14268"
    networks:
      - listen-wiseer-network
    profiles:
      - observability
