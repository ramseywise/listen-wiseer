[project]
name = "listen-wiseer"
version = "0.2.0"
description = "Music recommendation agent on free sources (MusicBrainz, ListenBrainz, Last.fm, Deezer) with LangGraph, GMM/LightGBM ranking, and Tavily web context"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Core data processing
    "polars>=1.43.2",
    # DuckDB <-> Polars interchange (.pl(), conn.register(polars_df)) goes through Arrow
    "pyarrow>=25.0.1",
    # LangGraph and LangChain ecosystem
    "langgraph>=1.2.11",
    "langchain>=1.3.15",
    "langchain-core>=1.5.3",
    "langchain-anthropic>=1.5.6,<1.8.0",
    # LLM providers
    "anthropic>=0.122,<2.0",
    # Wikipedia fallback for artist/genre context (agent/tools/web_search.py)
    "wikipedia>=1.4.0",
    # Web search
    "tavily-python>=0.7.27",
    # ML and similarity
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    # MCP server
    "mcp>=1.28.1",
    # Web interface
    "chainlit>=1.0.0",
    # Data validation
    "pydantic>=2.0.0",
    "pydantic-settings>=2.15.0",
    # Observability and logging
    "structlog>=26.1.0",
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    # Jaeger now receives traces via OTLP — exporter-jaeger was deprecated at 1.21.0
    "opentelemetry-exporter-otlp>=1.22.0",
    "opentelemetry-instrumentation>=0.44.0",
    # HTTP and async
    "httpx>=0.26.0",
    # Storage and ML
    "duckdb>=1.5.0",
    "lightgbm>=4.3.0",
    "gensim>=4.4.0",
    "catboost>=1.2.10",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langgraph-checkpoint-redis>=0.4.0",
    "psycopg[binary]>=3.3.4",
    "langmem>=0.0.30",
    # Eval & observability
    "langfuse>=4.14.4",
    "ragas>=0.2.0",
    "mutagen>=1.48.1",
]

[project.optional-dependencies]
# Semantic search over agent memory (agent/memory_store.py). Pulls torch; without it the
# InMemoryStore is unindexed. `uv sync --extra embeddings`.
embeddings = [
    "sentence-transformers>=5.7.0",
    # Listed directly so [tool.uv.sources] can route it to the CPU index on Linux.
    "torch>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]

# CPU-only torch on Linux (Docker): the default PyPI wheels pull ~6 GB of CUDA libs.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.16.3",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pyright>=1.1.408",
    "pytest-timeout>=2.4.0",
    # Notebook-only (notebooks/04, 06, 07)
    "scipy>=1.12.0",
    "imbalanced-learn>=0.14.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # bandit security
]
ignore = [
    "E501",  # line too long (handled by ruff-format)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S105", "S106"]  # allow assert and hardcoded passwords in tests
"notebooks/**" = ["ALL"]
"*.ipynb" = ["ALL"]
"src/**/storage/*.py" = ["S608"]  # SQL templates use only literal column names, no user input interpolated

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src"]
addopts = [
    "--verbose",
    "--strict-markers",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--asyncio-mode=auto",
]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires external resources (DuckDB file, Spotify, Redis)",
    "slow: tests that take >5s",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
